name: Communication DB CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches:
      - "hu-*-dev"
      - "qa/*"
      - "release/*"
      - "hotfix/*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test migrations and schema contract
        run: npm test

      - name: Validate Compose configuration
        run: docker compose config --quiet
