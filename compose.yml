services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - communication_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    restart: "no"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/SaludActiva_communication
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy

  seed:
    build: .
    command: ["npm", "run", "seed:dev"]
    profiles: ["seed"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/SaludActiva_communication
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  communication_mongodb_data:
